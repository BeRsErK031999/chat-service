image: node:20

stages:
  - install
  - lint
  - typecheck
  - test
  - image
  - build
  - deploy

default:
  interruptible: true
  cache:
    key:
      files:
        - yarn.lock
    paths:
      - node_modules/
  before_script:
    - corepack enable
    - yarn install --frozen-lockfile

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

.run_optional_script:
  script:
    - |
      if node -e "const scripts=require('./package.json').scripts||{}; process.exit(scripts[process.env.NPM_SCRIPT] ? 0 : 1)"; then
        yarn "$NPM_SCRIPT"
      else
        echo "Skipping missing script: $NPM_SCRIPT"
      fi

.build_kaniko_image:
  stage: image
  timeout: 20 minutes
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  before_script: []
  cache: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - |
      IMAGE_REPOSITORY="$CI_REGISTRY_IMAGE/$IMAGE_NAME"
      DESTINATIONS="--destination $IMAGE_REPOSITORY:$CI_COMMIT_SHORT_SHA"
      if [ "$CI_COMMIT_BRANCH" = "develop" ]; then
        DESTINATIONS="$DESTINATIONS --destination $IMAGE_REPOSITORY:dev"
      elif [ "$CI_COMMIT_BRANCH" = "main" ]; then
        DESTINATIONS="$DESTINATIONS --destination $IMAGE_REPOSITORY:prod"
      fi
      /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile "$CI_PROJECT_DIR/$DOCKERFILE" --snapshot-mode=redo --use-new-run --cache=true --cache-repo "$IMAGE_REPOSITORY/cache" $DESTINATIONS

install:
  stage: install
  timeout: 10 minutes
  script:
    - yarn install --frozen-lockfile
    - yarn prisma:generate

lint:
  stage: lint
  timeout: 10 minutes
  variables:
    NPM_SCRIPT: lint
  extends: .run_optional_script

typecheck:
  stage: typecheck
  timeout: 10 minutes
  variables:
    NPM_SCRIPT: type-check
  extends: .run_optional_script

test:
  stage: test
  timeout: 15 minutes
  variables:
    NPM_SCRIPT: test
  extends: .run_optional_script

build_backend_image:
  extends: .build_kaniko_image
  variables:
    IMAGE_NAME: backend
    DOCKERFILE: Dockerfile

build_frontend_image:
  extends: .build_kaniko_image
  variables:
    IMAGE_NAME: frontend
    DOCKERFILE: Dockerfile.frontend

build:
  stage: build
  timeout: 15 minutes
  script:
    - yarn build
  artifacts:
    when: on_success
    expire_in: 1 week
    paths:
      - dist/

.deploy:
  stage: deploy
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - cp "$SSH_PRIVATE_KEY" ~/.ssh/id_ed25519
    - cp "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts
    - chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
  cache: []
  dependencies: []
  script:
    - |
      set -e
      DEPLOY_TARGET_HOST="${DEPLOY_HOST}"
      if [ "${DEVOPS_ENV_DIR}" = "prod" ] && [ -n "${DEPLOY_HOST_PROD:-}" ]; then
        DEPLOY_TARGET_HOST="${DEPLOY_HOST_PROD}"
      fi
      DEPLOY_TARGET_USER="${DEPLOY_USER}"
      if [ "${DEVOPS_ENV_DIR}" = "prod" ] && [ -n "${DEPLOY_USER_PROD:-}" ]; then
        DEPLOY_TARGET_USER="${DEPLOY_USER_PROD}"
      fi
      COMPOSE_PATH="${STACK_COMPOSE_PATH:-${DEVOPS_ROOT:-/srv/devops}/${DEVOPS_ENV_DIR}/${SWARM_STACK_NAME}/docker-stack.yaml}"
      if [ "${DEVOPS_ENV_DIR}" = "dev" ] && [ -n "${STACK_COMPOSE_PATH_DEV:-}" ]; then
        COMPOSE_PATH="${STACK_COMPOSE_PATH_DEV}"
      elif [ "${DEVOPS_ENV_DIR}" = "prod" ] && [ -n "${STACK_COMPOSE_PATH_PROD:-}" ]; then
        COMPOSE_PATH="${STACK_COMPOSE_PATH_PROD}"
      fi
      ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
          "${DEPLOY_TARGET_USER}@${DEPLOY_TARGET_HOST}" bash -s <<EOF
      set -e
      echo '${REGISTRY_DEPLOY_TOKEN}' | docker login -u '${REGISTRY_DEPLOY_USER}' --password-stdin '${CI_REGISTRY}'
      docker stack deploy -c '${COMPOSE_PATH}' --with-registry-auth '${SWARM_STACK_NAME}'
      docker logout '${CI_REGISTRY}'
      EOF

deploy-backend-dev:
  extends: .deploy
  variables:
    DEVOPS_ENV_DIR: dev
    SWARM_STACK_NAME: chat_service
  environment:
    name: development
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

deploy-frontend-dev:
  extends: .deploy
  variables:
    DEVOPS_ENV_DIR: dev
    SWARM_STACK_NAME: chat_service_frontend
  environment:
    name: development
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

deploy-backend-prod:
  extends: .deploy
  variables:
    DEVOPS_ENV_DIR: prod
    SWARM_STACK_NAME: chat_service
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

deploy-frontend-prod:
  extends: .deploy
  variables:
    DEVOPS_ENV_DIR: prod
    SWARM_STACK_NAME: chat_service_frontend
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
